services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: adorablems
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d adorablems"]
      interval: 5s
      timeout: 5s
      retries: 10
    volumes:
      - db_data:/var/lib/postgresql/data

  backend:
    image: node:22-slim
    working_dir: /app
    depends_on:
      db:
        condition: service_healthy
    environment:
      NODE_ENV: development
      PORT: 4000
      DATABASE_URL: postgresql://postgres:postgres@db:5432/adorablems?schema=public
      FRONTEND_URL: https://3000-${BASE44_PUBLIC_HOST_SUFFIX}
      ACCESS_TOKEN_TTL: 15m
      REFRESH_TOKEN_TTL_DAYS: 7
      DEFAULT_COUNTRY_CALLING_CODE: "+234"
    env_file:
      - /run/base44/app.env
    volumes:
      - ./backend:/app
      - backend_node_modules:/app/node_modules
    command: sh -c "npm install && npx prisma generate && npx prisma migrate deploy && npm run db:seed && npm run dev"

  frontend:
    image: node:22-slim
    working_dir: /app
    depends_on:
      - backend
    environment:
      API_PROXY_TARGET: http://backend:4000
      VITE_API_URL: /api/v1
      __VITE_ADDITIONAL_SERVER_ALLOWED_HOSTS: ${BASE44_PUBLIC_HOST_SUFFIX}
    volumes:
      - ./frontend:/app
      - frontend_node_modules:/app/node_modules
    ports:
      - "3000:5173"
    command: sh -c "npm install && npm run dev"

volumes:
  db_data:
  backend_node_modules:
  frontend_node_modules:
